services:
  artemis-broker:
    image: apache/activemq-artemis:2.33.0-alpine
    container_name: artemis-broker
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
    ports:
      - "61616:61616"
      - "8161:8161"
    networks:
      - lab-network

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8002:8080"
    environment:
      JWT_SECRET: demo-local-secret-must-have-at-least-32-bytes
      AUTH_USERNAME: admin
      AUTH_PASSWORD: admin
    networks:
      - lab-network

  estoque-service:
    build:
      context: ./estoque-service
    container_name: estoque-service
    ports:
      - "8000:8080"
    depends_on:
      - artemis-broker
    environment:
      JWT_SECRET: demo-local-secret-must-have-at-least-32-bytes
      ARTEMIS_BROKER_URL: tcp://artemis-broker:61616
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    networks:
      - lab-network

  carrinho-service:
    build:
      context: ./carrinho-service
    container_name: carrinho-service
    ports:
      - "8001:8080"
    depends_on:
      - estoque-service
      - artemis-broker
    environment:
      SERVICES_ESTOQUE_URL: http://estoque-service:8080/estoque
      JWT_SECRET: demo-local-secret-must-have-at-least-32-bytes
      ARTEMIS_BROKER_URL: tcp://artemis-broker:61616
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    networks:
      - lab-network

networks:
  lab-network:
    name: lab-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
