spring.application.name=estoque-service
server.port=8080

jwt.secret=${JWT_SECRET:demo-local-secret-must-have-at-least-32-bytes}

spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://artemis-broker:61616}
spring.artemis.user=${ARTEMIS_USER:artemis}
spring.artemis.password=${ARTEMIS_PASSWORD:artemis}
spring.jms.listener.auto-startup=true
